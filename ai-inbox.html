<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AI questions · Adil</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --panel: #141416;
      --line: rgba(255,255,255,.08);
      --text: rgba(255,255,255,.88);
      --muted: rgba(255,255,255,.45);
      --accent: #7dd3a0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1a2430 0%, var(--bg) 55%);
      color: var(--text);
    }
    main {
      width: min(820px, calc(100% - 32px));
      margin: 40px auto 80px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin: 0 0 6px;
    }
    .sub {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .gate, .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    input {
      flex: 1;
      min-width: 180px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }
    button {
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.08);
      color: var(--text);
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,.12); }
    .err {
      color: #ff8e8e;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 14px;
    }
    .card {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .card .q {
      font-size: 15px;
      line-height: 1.45;
      margin: 0 0 8px;
    }
    .card .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .card .proj { color: var(--accent); }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>AI questions inbox</h1>
    <p class="sub">Private list of questions visitors asked the portfolio chat. Not linked from the public site.</p>

    <div id="gate" class="gate">
      <input id="token" type="password" placeholder="Access token" autocomplete="current-password">
      <button type="button" id="unlock">Open inbox</button>
    </div>
    <div id="err" class="err hidden"></div>

    <div id="app" class="hidden">
      <div class="toolbar">
        <button type="button" id="refresh">Refresh</button>
        <button type="button" id="logout">Lock</button>
      </div>
      <div id="meta" class="meta"></div>
      <div id="list"></div>
    </div>
  </main>

  <script>
    (function () {
      var ENDPOINT = 'https://adil-portfolio-ai.adil-3.workers.dev/questions';
      var KEY = 'adil_ai_questions_token';
      var $gate = document.getElementById('gate');
      var $app = document.getElementById('app');
      var $token = document.getElementById('token');
      var $err = document.getElementById('err');
      var $list = document.getElementById('list');
      var $meta = document.getElementById('meta');

      function showErr(msg) {
        $err.textContent = msg || '';
        $err.classList.toggle('hidden', !msg);
      }

      function fmt(ts) {
        try {
          return new Date(ts).toLocaleString(undefined, {
            dateStyle: 'medium',
            timeStyle: 'short'
          });
        } catch (e) {
          return ts;
        }
      }

      function render(rows) {
        if (!rows.length) {
          $list.innerHTML = '<div class="empty">No questions stored yet. Ask the site chat once, then refresh.</div>';
          $meta.textContent = '0 questions';
          return;
        }
        $meta.textContent = rows.length + ' recent question' + (rows.length === 1 ? '' : 's');
        $list.innerHTML = rows.map(function (r) {
          return (
            '<article class="card">' +
              '<p class="q"></p>' +
              '<div class="row">' +
                '<span class="proj"></span>' +
                '<span class="when"></span>' +
                '<span class="src"></span>' +
              '</div>' +
            '</article>'
          );
        }).join('');
        var cards = $list.querySelectorAll('.card');
        rows.forEach(function (r, i) {
          var card = cards[i];
          card.querySelector('.q').textContent = r.question || '(empty)';
          card.querySelector('.proj').textContent = r.projectName || r.projectId || 'Unknown project';
          card.querySelector('.when').textContent = fmt(r.ts);
          card.querySelector('.src').textContent = r.inputSource ? ('via ' + r.inputSource) : '';
        });
      }

      async function load() {
        var token = sessionStorage.getItem(KEY) || '';
        if (!token) return;
        showErr('');
        try {
          var res = await fetch(ENDPOINT + '?limit=200', {
            headers: { 'X-Questions-Token': token }
          });
          var data = await res.json().catch(function () { return {}; });
          if (!res.ok) {
            sessionStorage.removeItem(KEY);
            $app.classList.add('hidden');
            $gate.classList.remove('hidden');
            showErr(data.error || 'Could not load questions. Check the token.');
            return;
          }
          $gate.classList.add('hidden');
          $app.classList.remove('hidden');
          render(data.questions || []);
        } catch (e) {
          showErr('Network error — try again.');
        }
      }

      document.getElementById('unlock').addEventListener('click', function () {
        var t = ($token.value || '').trim();
        if (!t) {
          showErr('Enter the access token.');
          return;
        }
        sessionStorage.setItem(KEY, t);
        load();
      });
      $token.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('unlock').click();
      });
      document.getElementById('refresh').addEventListener('click', load);
      document.getElementById('logout').addEventListener('click', function () {
        sessionStorage.removeItem(KEY);
        $token.value = '';
        $app.classList.add('hidden');
        $gate.classList.remove('hidden');
        showErr('');
      });

      if (sessionStorage.getItem(KEY)) load();
    })();
  </script>
</body>
</html>
